networks:
  lan12:
    name: lan12
    driver: macvlan
    driver_opts:
      parent: eth3
    ipam:
      config:
        - subnet: "192.168.12.0/24"
          gateway: "192.168.12.254"
services:
  postgres:
    #image: postgres:13
    image: 192.168.13.73:5000/postgres:13
    restart: unless-stopped
    container_name: maxun-postgres
    hostname: maxun-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    #ports:
    #  - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      lan12:
        ipv4_address: 192.168.12.3
  minio:
    #image: minio/minio
    image: 192.168.13.73:5000/minio/minio
    restart: unless-stopped
    container_name: maxun-minio
    hostname: maxun-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address :${MINIO_CONSOLE_PORT:-9001}
    #ports:
    #  - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"  # API port
    #  - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"  # WebUI port
    volumes:
      - minio_data:/data
    networks:
      lan12:
        ipv4_address: 192.168.12.4
  backend:
    #build:
    #  context: .
    #  dockerfile: Dockerfile.backend
    #image: getmaxun/maxun-backend:latest
    image: 192.168.13.73:5000/getmaxun/maxun-backend:latest
    container_name: maxun-backend
    hostname: maxun-backend
    restart: unless-stopped
    #ports:
    #  - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    env_file: .env
    environment:
      BACKEND_URL: ${BACKEND_URL}
      # to ensure Playwright works in Docker
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
      # Force container/CI detection for headless mode
      CI: "true"
      CONTAINER: "true"
      # DEBUG: pw:api
      # PWDEBUG: 1  # Enables debugging
      CHROMIUM_FLAGS: '--disable-gpu --no-sandbox --headless=new'
      #VITE_BACKEND_URL: http://192.168.12.8:8080
      #VITE_PUBLIC_URL: http://192.168.12.8:5173
      #PUBLIC_URL: http://192.168.12.8:5173
    security_opt:
    - seccomp=unconfined  # This might help with browser sandbox issues
    #shm_size: '2gb' # Increase shared memory size for Chromium
    #mem_limit: 6g   # Set 6GB memory limit
    depends_on:
      - postgres
      - minio
    volumes:
      - /var/run/dbus:/var/run/dbus
    networks:
      lan12:
        ipv4_address: 192.168.12.5
  frontend:
    #build:
    #  context: .
    #  dockerfile: Dockerfile.frontend
    image: 192.168.13.73:5000/getmaxun/maxun-frontend:latest
    #image: getmaxun/maxun-frontend:latest
    container_name: maxun-frontend
    hostname: maxun-frontend
    restart: unless-stopped
    #ports:
    #  - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    env_file: .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      BACKEND_URL: ${BACKEND_URL}
    depends_on:
      - backend
    networks:
      lan12:
        ipv4_address: 192.168.12.6
  browser:
    hostname: maxun-browser
    container_name: maxun-browser
    image: 192.168.13.73:5000/sleechengn/maxun-browser:latest
    #build:
    #  context: .
    #  dockerfile: browser/Dockerfile
    #  args:
    #    BROWSER_WS_PORT: ${BROWSER_WS_PORT:-3001}
    #    BROWSER_HEALTH_PORT: ${BROWSER_HEALTH_PORT:-3002}
    #ports:
    #  - "${BROWSER_WS_PORT:-3001}:${BROWSER_WS_PORT:-3001}"
    #  - "${BROWSER_HEALTH_PORT:-3002}:${BROWSER_HEALTH_PORT:-3002}"
    environment:
      - NODE_ENV=production
      - DEBUG=pw:browser*
      - BROWSER_WS_PORT=${BROWSER_WS_PORT:-3001}
      - BROWSER_HEALTH_PORT=${BROWSER_HEALTH_PORT:-3002}
      - BROWSER_WS_HOST=${BROWSER_WS_HOST:-browser}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BROWSER_HEALTH_PORT:-3002}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    #deploy:
    #  resources:
    #    limits:
    #      memory: 2G
    #      cpus: '1.5'
    #    reservations:
    #      memory: 1G
    #      cpus: '1.0'
    security_opt:
      - seccomp:unconfined
    #shm_size: 2gb
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    networks:
      lan12:
        ipv4_address: 192.168.12.7
    dns:
      - 119.29.29.29
  nginx:
    hostname: maxun-nginx
    container_name: maxun-nginx
    image: 192.168.13.73:5000/nginx:latest
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    networks:
      lan12:
        ipv4_address: 192.168.12.8
    dns:
      - 119.29.29.29
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/maxun/postgres
      o: bind
  minio_data:
    driver: local
    driver_opts:
      type: none
      device: ./volumes/maxun/minio
      o: bind
